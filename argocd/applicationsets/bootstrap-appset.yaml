apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bootstrap
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/luciano-veiga/k8s-gitops-lab
      revision: HEAD
      directories:
      - path: apps/bootstrap/*
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
    spec:
      project: bootstrap
      source:
        repoURL: https://github.com/luciano-veiga/k8s-gitops-lab
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
