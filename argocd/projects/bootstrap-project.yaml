apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
spec:
  description: "Bootstrap components: ArgoCD, Sealed Secrets, Ingress"
  sourceRepos:
  - 'https://github.com/luciano-veiga/k8s-gitops-lab'
  destinations:
  - namespace: argocd
    server: https://kubernetes.default.svc
  - namespace: sealed-secrets
    server: https://kubernetes.default.svc
  - namespace: ingress-nginx
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
