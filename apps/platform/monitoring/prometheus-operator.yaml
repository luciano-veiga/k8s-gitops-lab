# Prometheus Operator Deployment (minimal)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-operator
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-operator
  template:
    metadata:
      labels:
        app: prometheus-operator
    spec:
      containers:
      - name: prometheus-operator
        image: quay.io/prometheus-operator/prometheus-operator:v0.75.0
        args:
        - --kubelet-service=kube-system/kubelet
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-operator
  namespace: monitoring
spec:
  selector:
    app: prometheus-operator
  ports:
  - port: 8080
    targetPort: 8080